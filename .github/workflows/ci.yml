name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  revela:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/revela
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/revela/go.mod
          cache-dependency-path: tools/revela/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Conferir os rolos
        run: go run ./cmd/revela check ../../art/rolls
      - name: Revelar os rolos
        run: go run ./cmd/revela build ../../art/rolls "$RUNNER_TEMP/rolls"
